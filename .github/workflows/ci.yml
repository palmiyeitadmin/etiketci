name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # Enables the PostgreSQL integration tests (they are skipped when this is not set).
      PLMS_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build src/backend/Plms.Tests -c Release
      # xUnit v3 test projects are executables; running them directly avoids the VSTest adapter.
      - name: Test
        run: dotnet run --project src/backend/Plms.Tests -c Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:5001
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret-not-used-at-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint -- --max-warnings 0
      - name: Build
        run: npm run build
